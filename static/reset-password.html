<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Новый пароль - PhishDet</title>
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/editorial.css">
    <link rel="stylesheet" href="css/editorial-pages.css">
</head>
<body>
    <div class="scroll-progress" aria-hidden="true"><span id="scrollProgressBar"></span></div>

    <header class="header" id="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo" aria-label="PhishDet - на главную">
                    <span class="logo-icon">
                        <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="49" cy="15" r="4.5" fill="#d63a24"/><path d="M40 11v32c-9 6-21 1-23-9 -2-11 6-21 16-21 3 0 5 .7 7 2" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round"/></svg>
                    </span>
                    <span class="logo-word">Phish<span class="logo-word-accent">Det</span></span>
                </a>
                <a href="auth.html" class="back-link">Ко входу</a>
            </div>
        </div>
    </header>

    <main>
        <div class="container auth-page auth-page--single">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">Новый пароль</h1>
                    <p class="auth-subtitle">После смены все входы на других устройствах закончатся.</p>
                </div>

                <form class="auth-form active" id="resetForm">
                    <label class="field">
                        <span class="lbl">Новый пароль</span>
                        <input type="password" class="auth-input" id="newPassword" placeholder="минимум 8 символов" autocomplete="new-password" minlength="8" required>
                        <span class="field-hint">От 8 символов, хотя бы одна буква и одна цифра.</span>
                    </label>
                    <label class="field">
                        <span class="lbl">Повторите пароль</span>
                        <input type="password" class="auth-input" id="newPasswordConfirm" placeholder="ещё раз" autocomplete="new-password" required>
                    </label>
                    <button type="submit" class="btn btn-verm auth-btn">Сохранить пароль</button>
                    <div class="auth-status" id="resetStatus"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/password-rules.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
