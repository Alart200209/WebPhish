version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: phishdet_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phishdet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secret_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-phishdet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishdet_user} -d ${POSTGRES_DB:-phishdet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: phishdet_web
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: